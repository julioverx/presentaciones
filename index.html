<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presentaciones</title>
  <link rel="icon" type="image/svg+xml" href="Assets/Logo.svg">
  <link rel="stylesheet" href="Assets/css/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- Header -->
  <header class="hub-header">
    <div class="hub-header-container">
      <a href="index.html" class="hub-brand">
        <img src="Assets/Logo.svg" alt="Logo" class="hub-logo">
        <div>
          <div class="hub-title">Presentaciones</div>
          <div class="hub-subtitle">Plataforma de Diapositivas Académicas</div>
        </div>
      </a>
    </div>
  </header>

  <!-- Filtros y Búsqueda -->
  <section class="hub-top-bar">
    <input type="text" id="search-input" class="search-input-box" placeholder="Buscar presentación por título, tema o asignatura...">

    <div class="filter-row" id="filter-container">
      <button class="filter-btn-orthogonal active" data-filter="all">Todas</button>
      <!-- Categorías dinámicas -->
    </div>
  </section>

  <!-- Grilla de Diapositivas -->
  <main class="hub-container">
    <div class="hub-grid" id="presentations-grid">
      <!-- Se puebla dinámicamente con JS -->
    </div>
  </main>

  <!-- Footer discreto -->
  <footer class="hub-footer">
    <p>Universidad Nacional Experimental Simón Rodríguez • Decanato de Postgrado y Educación Avanzada</p>
  </footer>

  <!-- Scripts -->
  <script src="Assets/js/presentations.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();

      const gridEl = document.getElementById('presentations-grid');
      const searchInput = document.getElementById('search-input');
      const filterContainer = document.getElementById('filter-container');

      let currentFilter = 'all';
      let currentQuery = '';

      // Generar botones de filtro según materias
      const subjects = Array.from(new Set(PRESENTATIONS.map(p => p.subject)));
      subjects.forEach(subject => {
        const btn = document.createElement('button');
        btn.className = 'filter-btn-orthogonal';
        btn.dataset.filter = subject;
        btn.textContent = subject;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn-orthogonal').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          currentFilter = subject;
          render();
        });
        filterContainer.appendChild(btn);
      });

      document.querySelector('[data-filter="all"]').addEventListener('click', function() {
        document.querySelectorAll('.filter-btn-orthogonal').forEach(b => b.classList.remove('active'));
        this.classList.add('active');
        currentFilter = 'all';
        render();
      });

      searchInput.addEventListener('input', (e) => {
        currentQuery = e.target.value.toLowerCase().trim();
        render();
      });

      function render() {
        const filtered = PRESENTATIONS.filter(item => {
          const matchesFilter = currentFilter === 'all' || item.subject === currentFilter;
          const searchTargets = [item.title, item.subtitle, item.subject, ...(item.tags || [])].join(' ').toLowerCase();
          const matchesQuery = !currentQuery || searchTargets.includes(currentQuery);
          return matchesFilter && matchesQuery;
        });

        if (filtered.length === 0) {
          gridEl.innerHTML = `<p style="color: var(--text-light); grid-column: 1 / -1; padding: 2rem 0;">No se encontraron presentaciones para los criterios seleccionados.</p>`;
          return;
        }

        gridEl.innerHTML = filtered.map(item => `
          <article class="hub-card">
            <div class="hub-card-header">
              <span>${item.subject.toUpperCase()}</span>
              <span>${item.slidesCount} SLIDES</span>
            </div>
            <div class="hub-card-body">
              <h2 class="hub-card-title">${item.title}</h2>
              <p class="hub-card-desc">${item.subtitle}</p>

              <div class="hub-card-meta">
                <span style="font-size: 0.8rem; color: var(--text-light); font-weight: 500;">${item.date}</span>
                <a href="${item.url}" class="hub-card-btn">
                  <span>Abrir Diapositivas</span>
                  <i data-lucide="arrow-right" style="width: 14px; height: 14px;"></i>
                </a>
              </div>
            </div>
          </article>
        `).join('');

        lucide.createIcons();
      }

      render();
    });
  </script>
</body>
</html>
